<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account — LibreCrawl</title>
    <link rel="stylesheet" href="/static/css/tw.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--ink);
        }
        .register-container {
            background: var(--bg-glass);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            border: 1px solid var(--border-hairline);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 460px;
            padding: 40px 32px;
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo h1 { font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 4px; letter-spacing: -0.01em; }
        .logo p { color: var(--fg-muted); font-size: 13px; }
        .form-group { margin-bottom: 14px; position: relative; }
        label { display: block; margin-bottom: 6px; color: var(--fg-muted); font-weight: 500; font-size: 12px; }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            background: var(--card);
            border: 1px solid var(--border-functional);
            border-radius: 6px;
            font-size: 13px;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary);
        }
        .field-hint {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 4px;
            min-height: 14px;
        }
        .field-hint.error { color: var(--error); }
        .field-hint.success { color: var(--success); }
        .strength-meter {
            height: 3px;
            background: var(--panel-2);
            border-radius: 9999px;
            margin-top: 6px;
            overflow: hidden;
        }
        .strength-meter-fill {
            height: 100%;
            width: 0;
            background: var(--primary);
            transition: width 0.15s, background 0.15s;
        }
        .strength-meter-fill.weak { background: var(--error); width: 33%; }
        .strength-meter-fill.medium { background: var(--warning); width: 66%; }
        .strength-meter-fill.strong { background: var(--success); width: 100%; }
        .btn {
            width: 100%;
            padding: 10px 14px;
            background: var(--primary);
            color: var(--primary-fg);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { background: var(--primary-active); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--fg-muted);
            font-size: 13px;
        }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .login-link a:hover { text-decoration: underline; }
        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            border: 1px solid;
        }
        .alert-error {
            background: var(--error-bg);
            border-color: var(--error-border);
            color: var(--error);
        }
        .alert-success {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success);
        }
        .alert.show { display: block; }
    </style>
</head>
<body class="canvas-ambient">
    <div class="register-container">
        <div class="logo">
            <h1>Create your account</h1>
            <p>Free forever. No card required.</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus minlength="3" maxlength="50">
                <div class="field-hint" id="usernameHint"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <div class="field-hint" id="emailHint"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">
                <div class="strength-meter"><div class="strength-meter-fill" id="strengthFill"></div></div>
                <div class="field-hint" id="passwordHint">At least 8 characters</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div class="field-hint" id="confirmHint"></div>
            </div>

            <button type="submit" class="btn" id="registerBtn">Register</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const alert = document.getElementById('alert');

        // Check if registration is disabled
        const registrationDisabled = {{ 'true' if registration_disabled else 'false' }};

        if (registrationDisabled) {
            // Disable form submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                window.alert('Registrations are disabled');
            });
            registerBtn.disabled = true;
            registerBtn.textContent = 'Registration Disabled';
        }

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
        }

        function hideAlert() {
            alert.className = 'alert';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Client-side validation
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'error');
                return;
            }

            if (username.length < 3) {
                showAlert('Username must be at least 3 characters', 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = 'Registering...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert(data.message, 'success');
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(data.message, 'error');
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Register';
                }
            } catch (error) {
                showAlert('An error occurred. Please try again.', 'error');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
