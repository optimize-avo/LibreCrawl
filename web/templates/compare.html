<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Crawls — AVO Crawl</title>
    <link rel="stylesheet" href="/static/css/tw.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
        }
        .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
        .main-content {
            flex: 1; min-width: 0;
            padding: 24px 28px;
            overflow-y: auto;
        }

        /* Diff item styles */
        .diff-item {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .diff-fixed {
            background: rgba(16,185,129,0.08);
            border-left: 3px solid var(--success);
        }
        .diff-still {
            background: var(--panel);
            border-left: 3px solid var(--fg-muted);
        }
        .diff-new {
            background: rgba(239,68,68,0.08);
            border-left: 3px solid var(--error);
        }

        /* Category section styles */
        .category-section {
            border: 1px solid var(--border-hairline);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .category-header {
            padding: 12px 16px;
            background: var(--panel);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .category-header:hover { background: var(--muted); }
        .category-items {
            padding: 8px 12px;
            display: none;
        }

        /* Summary card styles */
        .summary-card {
            background: var(--card);
            border: 1px solid var(--border-hairline);
            border-radius: 8px;
            padding: 14px 16px;
            text-align: center;
        }
        .summary-card .count {
            font-size: 24px;
            font-weight: 600;
        }
        .summary-card .label {
            font-size: 12px;
            color: var(--fg-muted);
            margin-top: 4px;
        }

        /* Header card styles */
        .crawl-card {
            background: var(--card);
            border: 1px solid var(--border-hairline);
            border-radius: 8px;
            padding: 14px 16px;
        }
        .crawl-card .tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg-muted);
            margin-bottom: 6px;
        }
        .crawl-card .date {
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
        }
        .crawl-card .meta {
            font-size: 12px;
            color: var(--fg-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        {% include 'partials/_navbar.html' %}
        <div class="main-content">
            <!-- Header -->
            <div id="compareHeader" style="margin-bottom:24px;">
                <p style="color:var(--fg-muted);font-size:13px;">Loading comparison...</p>
            </div>
            <!-- Summary -->
            <div id="compareSummary" style="display:none;margin-bottom:24px;"></div>
            <!-- Categories -->
            <div id="compareCategories"></div>
        </div>
    </div>

    <script src="/static/js/compare.js"></script>
    <script>
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            } catch (e) { /* ignore */ }
            window.location.href = '/login';
        }
    </script>
</body>
</html>
