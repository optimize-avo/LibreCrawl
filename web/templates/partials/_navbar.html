<nav class="navbar" aria-label="Primary">
  <div class="navbar-inner">
    <!-- Left: Logo -->
    <a href="/" class="navbar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path>
      </svg>
      <span class="navbar-wordmark">AVO Crawl</span>
    </a>

    <!-- Center: Nav links -->
    <div class="navbar-links">
      <a href="/" class="navbar-link {% if request and request.path == '/' %}active{% endif %}"
         aria-current="{{ 'page' if request and request.path == '/' else 'false' }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        Crawl
      </a>
      <a href="/dashboard" class="navbar-link {% if request and request.path.startswith('/dashboard') %}active{% endif %}"
         aria-current="{{ 'page' if request and request.path.startswith('/dashboard') else 'false' }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/>
        </svg>
        History
      </a>
      <a href="/settings" class="navbar-link {% if request and request.path.startswith('/settings') %}active{% endif %}"
         aria-current="{{ 'page' if request and request.path.startswith('/settings') else 'false' }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </a>
    </div>

    <!-- Right: User + sign out -->
    <div class="navbar-user">
      <div class="navbar-avatar">
        {{ (user.username[:1] if user and user.username else 'L') | upper }}
      </div>
      <span class="navbar-username">{{ user.username if user and user.username else 'Guest' }}</span>
      <button type="button" onclick="logout()" class="navbar-signout">Sign out</button>
    </div>
  </div>
</nav>
