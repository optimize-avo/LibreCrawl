<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved crawls — LibreCrawl</title>
    <link rel="stylesheet" href="/static/css/tw.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
        }
        .app-shell { display: flex; min-height: 100vh; }
        .main-content {
            flex: 1; min-width: 0;
            padding: 24px 28px;
        }
        .page-header { margin-bottom: 20px; }
        .page-header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
        .page-header p { color: var(--fg-muted); font-size: 12px; margin-top: 4px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border-hairline);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .stat-label {
            color: var(--fg-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        .stat-value {
            color: var(--ink);
            font-size: 22px;
            font-weight: 600;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }
        .table-card {
            background: var(--card);
            border: 1px solid var(--border-hairline);
            border-radius: 10px;
            overflow: hidden;
        }
        .crawls-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .crawls-table thead th {
            background: var(--panel);
            color: var(--fg-muted);
            font-weight: 500;
            font-size: 12px;
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-hairline);
        }
        .crawls-table tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-line);
            font-size: 13px;
            color: var(--ink);
        }
        .crawls-table tbody tr:hover td { background: var(--muted); }
        .crawls-table tbody tr:last-child td { border-bottom: none; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 9999px;
            border: 1px solid var(--border-hairline);
        }
        .status-completed { color: var(--success); border-color: var(--success-border); }
        .status-running { color: var(--primary); border-color: var(--border-hairline); }
        .status-paused { color: var(--warning); border-color: var(--warning-border); }
        .status-failed { color: var(--error); border-color: var(--error-border); }
        .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
        .action-btn {
            padding: 4px 10px;
            background: var(--panel-2);
            color: var(--ink);
            border: 1px solid var(--border-hairline);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .action-btn:hover { background: var(--muted); }
        .action-btn.danger { color: var(--error); border-color: var(--error-border); }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--fg-muted);
        }
        .empty-state h2 { font-size: 16px; color: var(--ink); margin-bottom: 6px; }
        .empty-state p { font-size: 13px; }
        .url-link { color: var(--primary); text-decoration: none; font-family: 'Inter', sans-serif; }
        .url-link:hover { text-decoration: underline; }
        .status-badge {
            display: inline-flex; align-items: center;
            padding: 2px 8px;
            font-size: 11px; font-weight: 500;
            border-radius: 9999px;
            border: 1px solid var(--border-hairline);
            background: var(--card);
            color: var(--ink);
        }
        .status-badge.status-completed { color: var(--success); border-color: var(--success-border); }
        .status-badge.status-running   { color: var(--primary); border-color: var(--border-hairline); }
        .status-badge.status-paused    { color: var(--warning); border-color: var(--warning-border); }
        .status-badge.status-failed    { color: var(--error); border-color: var(--error-border); }
        .actions { display: flex; gap: 6px; justify-content: flex-end; }
        .btn {
            padding: 4px 10px;
            background: var(--panel-2);
            color: var(--ink);
            border: 1px solid var(--border-hairline);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: var(--muted); }
        .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--panel-2); color: var(--ink); }
        .btn-danger { color: var(--error); border-color: var(--error-border); }
        .btn-small { padding: 3px 8px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="app-shell">
        {% include 'partials/_rail.html' %}

        <div class="main-content">
            <div class="page-header">
                <h1>Saved crawls</h1>
                <p>All crawls stored on this server</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="total-crawls">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" id="completed-crawls">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Running</div>
                    <div class="stat-value" id="running-crawls">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">DB size</div>
                    <div class="stat-value" id="db-size">-</div>
                </div>
            </div>

            <div class="table-card">
                <table class="crawls-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Status</th>
                            <th>Pages</th>
                            <th>Last opened</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="crawls-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/crawls/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('total-crawls').textContent = data.total_crawls || 0;
                    document.getElementById('completed-crawls').textContent = data.by_status.completed || 0;
                    document.getElementById('running-crawls').textContent = (data.by_status.running || 0) + (data.by_status.paused || 0);
                    document.getElementById('db-size').textContent = (data.database_size_mb || 0).toFixed(1) + ' MB';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadCrawls() {
            try {
                const response = await fetch('/api/crawls/list');
                const data = await response.json();

                const tbody = document.getElementById('crawls-tbody');

                if (data.success && data.crawls.length > 0) {
                    tbody.innerHTML = data.crawls.map(crawl => {
                        const started = new Date(crawl.started_at).toLocaleString();
                        const duration = crawl.completed_at
                            ? calculateDuration(crawl.started_at, crawl.completed_at)
                            : 'In progress';

                        return `
                            <tr>
                                <td>${started}</td>
                                <td><a href="${crawl.base_url}" target="_blank" class="url-link">${crawl.base_url}</a></td>
                                <td><span class="status-badge status-${crawl.status}">${crawl.status}</span></td>
                                <td>${crawl.urls_crawled || 0}</td>
                                <td>${duration}</td>
                                <td class="actions">
                                    ${(crawl.status === 'paused' || crawl.status === 'failed') && crawl.urls_crawled > 0
                                        ? `<button class="btn btn-primary btn-small" onclick="resumeCrawl(${crawl.id})">Resume</button>`
                                        : ''}
                                    ${crawl.urls_crawled > 0
                                        ? `<button class="btn btn-secondary btn-small" onclick="viewCrawl(${crawl.id})">Load</button>`
                                        : ''}
                                    <button class="btn btn-danger btn-small" onclick="deleteCrawl(${crawl.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty-state">
                                <h3>No crawls found</h3>
                                <p>Start a new crawl from the main application</p>
                            </td>
                        </tr>
                    `;
                }
            } catch (error) {
                console.error('Error loading crawls:', error);
                document.getElementById('crawls-tbody').innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">
                            <h3>Error loading crawls</h3>
                            <p>${error.message}</p>
                        </td>
                    </tr>
                `;
            }
        }

        function calculateDuration(start, end) {
            const startTime = new Date(start);
            const endTime = new Date(end);
            const diff = endTime - startTime;

            const hours = Math.floor(diff / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);

            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${seconds}s`;
            return `${seconds}s`;
        }

        async function resumeCrawl(crawlId) {
            if (!confirm('Resume this crawl? It will continue from where it left off.')) return;

            try {
                const response = await fetch(`/api/crawls/${crawlId}/resume`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    alert('Crawl resumed successfully. Redirecting...');
                    window.location.href = '/';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error resuming crawl: ' + error.message);
            }
        }

        async function viewCrawl(crawlId) {
            if (!confirm('Load this crawl? Any unsaved current data will be lost.')) return;

            try {
                const response = await fetch(`/api/crawls/${crawlId}/load`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    // Store flag in sessionStorage to tell main UI to force refresh
                    sessionStorage.setItem('force_ui_refresh', 'true');
                    sessionStorage.setItem('loaded_urls', data.urls_count);
                    sessionStorage.setItem('loaded_links', data.links_count);
                    sessionStorage.setItem('loaded_issues', data.issues_count);
                    window.location.href = '/';
                } else {
                    alert('Error: ' + (data.error || data.message));
                }
            } catch (error) {
                alert('Error loading crawl: ' + error.message);
            }
        }

        async function deleteCrawl(crawlId) {
            if (!confirm('Delete this crawl permanently? This cannot be undone.')) return;

            try {
                const response = await fetch(`/api/crawls/${crawlId}/delete`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    loadCrawls();
                    loadStats();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error deleting crawl: ' + error.message);
            }
        }

        loadStats();
        loadCrawls();

        setInterval(() => {
            loadStats();
            loadCrawls();
        }, 30000);
    </script>
</body>
</html>
