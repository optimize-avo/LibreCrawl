<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — AVO Crawl</title>
    <link rel="stylesheet" href="/static/css/tw.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            margin: 0;
        }
        .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 0;
            min-height: 0;
        }

        /* Domain Sidebar */
        #domainSidebar {
            width: 240px;
            min-width: 240px;
            border-right: 1px solid var(--border-hairline);
            background: var(--panel);
            padding: 16px 0;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 0 16px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--fg-muted);
        }
        .domain-item {
            padding: 8px 16px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.12s ease;
        }
        .domain-item:hover {
            background: var(--muted);
        }
        .domain-item.active {
            border-left-color: var(--primary);
            background: var(--muted);
        }
        .domain-item .domain-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .domain-item .domain-count {
            font-size: 11px;
            color: var(--fg-muted);
            margin-top: 2px;
        }

        /* Crawl Detail Area */
        #crawlDetailArea {
            flex: 1;
            min-width: 0;
            padding: 24px 28px;
        }
        .domain-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .domain-header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
        }
        .domain-header .domain-stats {
            font-size: 12px;
            color: var(--fg-muted);
            margin-top: 4px;
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 9999px;
            border: 1px solid var(--border-hairline);
            background: var(--card);
            color: var(--ink);
        }
        .status-badge.status-completed    { color: var(--success); border-color: var(--success-border); }
        .status-badge.status-running      { color: var(--primary); border-color: var(--border-hairline); }
        .status-badge.status-paused       { color: var(--warning); border-color: var(--warning-border); }
        .status-badge.status-failed       { color: var(--error); border-color: var(--error-border); }
        .status-badge.status-stopped      { color: var(--muted-fg); border-color: var(--border-hairline); opacity: 0.7; }
        .status-badge.status-idle         { color: var(--muted-fg); border-color: var(--border-hairline); opacity: 0.5; }
        .status-badge.status-archived     { color: var(--muted-fg); border-color: var(--border-hairline); }
        .status-badge.status-demo_stopped { color: var(--warning); border-color: var(--warning-border); }

        /* Crawl Cards */
        .crawl-card {
            border: 1px solid var(--border-hairline);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            transition: background 0.12s ease;
        }
        .crawl-card:hover {
            background: var(--muted);
        }
        .crawl-card.selected {
            border-color: var(--primary);
            background: var(--muted);
        }

        /* Compare Bar */
        .compare-bar {
            background: var(--primary);
            color: var(--primary-fg);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .compare-bar .compare-link {
            padding: 6px 14px;
            background: var(--primary-fg);
            color: var(--primary);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }
        .compare-bar .compare-link:hover {
            opacity: 0.9;
        }

        /* Action Buttons */
        .action-btn {
            padding: 4px 10px;
            background: var(--panel-2, var(--panel));
            color: var(--ink);
            border: 1px solid var(--border-hairline);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .action-btn:hover { background: var(--muted); }
        .action-btn.danger { color: var(--error); border-color: var(--error-border); }

        /* Buttons */
        .btn {
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid var(--border-hairline);
            border-radius: 6px;
            background: var(--card);
            color: var(--ink);
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: var(--muted); }
        .btn-primary {
            background: var(--primary);
            color: var(--primary-fg);
            border-color: var(--primary);
        }
        .btn-primary:hover { background: var(--primary-hover, var(--primary)); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--fg-muted);
        }
        .empty-state p { font-size: 14px; }

        /* Compare checkbox */
        .compare-checkbox {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Active Crawls Animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        {% include 'partials/_navbar.html' %}
        <div class="main-content">
            <!-- Active Crawl Section -->
            <div id="activeCrawlsSection" style="display:none; padding: 16px 20px;"></div>

            <!-- Domain Sidebar -->
            <div id="domainSidebar">
                <div class="sidebar-header">Domains</div>
                <div id="domainList"></div>
            </div>
            <!-- Crawl Detail -->
            <div id="crawlDetailArea">
                <div id="crawlDetail">
                    <div class="empty-state">
                        <p>Select a domain to view crawl history</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
    <script>
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
            } catch (e) { /* ignore */ }
            window.location.href = '/login';
        }
    </script>
</body>
</html>
